[package]
name = "send_bombing"
version = "0.1.0"
edition = "2021"

[dependencies]
vercel_runtime = "1.1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
