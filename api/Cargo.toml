[package]
name = "send_bombing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "send_bombing"
path = "api/send_bombing.rs"

[dependencies]
vercel_runtime = "1.0.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
